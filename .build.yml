name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Arrange project folders
        run: |
          mkdir -p app/src/main/java/app/tunebox app/src/main/assets app/src/main/res
          mv MainActivity.java PlayService.java YouTubeActivity.java PlayWidget.java app/src/main/java/app/tunebox/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv app-build.gradle app/build.gradle
          for f in res_*; do
            [ -f "$f" ] || continue
            d=$(echo "$f" | cut -d_ -f2)
            n="${f#res_${d}_}"
            mkdir -p "app/src/main/res/$d"
            mv "$f" "app/src/main/res/$d/$n"
          done
      - name: Build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Tunebox-apk
          path: app/build/outputs/apk/debug/app-debug.apk
