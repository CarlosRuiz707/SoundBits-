name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Arrange project folders
        run: |
          mkdir -p app/src/main/java/app/tunebox app/src/main/assets
          mv MainActivity.java PlayService.java app/src/main/java/app/tunebox/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv app-build.gradle app/build.gradle
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tunebox-apk
          path: app/build/outputs/apk/debug/app-debug.apk