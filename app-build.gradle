plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' apply false
}

// Google Services solo se aplica cuando el proyecto ya tiene su configuración Firebase.
// Sin google-services.json, la app sigue compilando y la función de cuenta queda desactivada.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Coloca automaticamente los archivos sueltos de la raiz del repositorio (res_*.xml y *.java)
// en las carpetas que Android espera. Funciona con el flujo de GitHub antiguo y con el nuevo.
def rootFiles = rootProject.projectDir
def genRes = new File(projectDir, 'build/genres')
def genJava = new File(projectDir, 'build/genjava')
tasks.register('arrange') {
    doLast {
        project.delete(genRes, genJava)
        genRes.mkdirs(); genJava.mkdirs()
        rootFiles.listFiles().each { f ->
            if (!f.isFile()) return
            // Ignora copias sueltas como "MainActivity (1).java": duplican la clase y rompen javac
            if (f.name.endsWith('.java') && !f.name.matches('[A-Za-z_][A-Za-z0-9_]*\\.java')) return
            if (f.name.startsWith('res_') && !f.name.matches('res_[a-z0-9]+_[A-Za-z0-9_.]+')) return
            if (f.name.startsWith('res_')) {
                def parts = f.name.split('_', 3)
                def d = new File(genRes, parts[1]); d.mkdirs()
                new File(d, parts[2]).bytes = f.bytes
            } else if (f.name.endsWith('.java')) {
                new File(genJava, f.name).bytes = f.bytes
            }
        }
    }
}
preBuild.dependsOn 'arrange'

android {
    namespace 'app.tunebox'
    compileSdk 35
    defaultConfig { applicationId "app.tunebox"; minSdk 24; targetSdk 34; versionCode 13; versionName "2.1.1" }
    sourceSets { main { res.srcDir genRes; java.srcDir genJava } }
    signingConfigs {
        debug {
            storeFile rootProject.file('tunebox.jks')
            storePassword 'tunebox123'
            keyAlias 'tunebox'
            keyPassword 'tunebox123'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


dependencies {
    // Google Sign-In nativo mediante Credential Manager + Firebase Authentication.
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
}
