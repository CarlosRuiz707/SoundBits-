<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TuneBox</title>
<style>
:root{color-scheme:dark;--bg:#070d16;--card:#101c2b;--tx:#eef4f8;--mu:#93a6b8;--ac:#4cc9e6;--nav:64px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at 50% -18%,rgba(76,201,230,.11),transparent 46%),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}#main{max-width:760px;margin:auto;padding:28px 20px calc(var(--nav) + 108px + env(safe-area-inset-bottom))}h1{font-size:28px;letter-spacing:-.7px;margin:4px 0 16px}h2{font-size:21px;margin:24px 0 10px}.search{width:100%;margin:0 0 12px;border:1px solid #ffffff0d;border-radius:12px;padding:14px;background:#17283b;color:#fff;font:inherit}.card{background:linear-gradient(145deg,#122234,#0c1724);border:1px solid #ffffff0b;border-radius:14px;padding:12px 16px}.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff12;cursor:pointer}.row:last-child{border:0}.cover{width:54px;height:54px;border-radius:7px;flex:none;object-fit:cover;background:linear-gradient(135deg,#405b70,#183326);display:grid;place-items:center;font-size:23px}.meta{min-width:0;flex:1}.title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:var(--mu);font-size:22px}#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;background:rgba(7,13,22,.97);border-top:1px solid #ffffff12;z-index:5}#nav button{flex:1;max-width:240px;background:none;border-radius:0;color:var(--mu);font-size:12px;padding:9px 4px}#nav button.active{color:var(--ac)}#sheet{position:fixed;inset:0;z-index:10;background:#0009;display:none;align-items:flex-end}#sheet.show{display:flex}#sheet>section{width:100%;max-width:720px;margin:auto;background:#122234;border:1px solid #ffffff12;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}#sheet button{display:block;width:100%;text-align:left;background:transparent;border-bottom:1px solid #ffffff18;border-radius:0;padding:14px 2px;color:var(--tx)}#player{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px);z-index:7;display:none;align-items:center;gap:10px;background:#14263a;border:1px solid #ffffff12;border-radius:10px;padding:8px 10px;box-shadow:0 4px 20px #0008}#player .cover{width:42px;height:42px}#play{background:none;font-size:22px;padding:8px;color:white}#toast{display:none;position:fixed;z-index:20;top:20px;left:50%;transform:translateX(-50%);background:#e6f6fb;color:#07202b;padding:10px 16px;border-radius:10px;font-weight:600}.empty{text-align:center;color:var(--mu);padding:20px 8px}.hint{color:var(--mu);font-size:14px;line-height:1.55}.hero{padding:18px;border-radius:14px;background:linear-gradient(135deg,#15364a,#102033);margin-bottom:20px}.hero b{font-size:20px}
</style>
</head>
<body>
<main id="main"></main>
<div id="player"><div id="playerArt" class="cover">♫</div><div class="meta"><div id="playerTitle" class="title"></div><div id="playerSub" class="sub"></div></div><button id="play" aria-label="Reproducir">▶</button></div>
<nav id="nav"></nav><div id="sheet"><section id="sheetBody"></section></div><div id="toast"></div><audio id="audio" preload="none" playsinline></audio>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)},app=$('main'),audio=$('audio'),tab='home',query='',podcastQuery='',podcasts=[],feedEpisodes=[],selectedPodcast=null,requestNo=0,searchTimer=null,current={};
function esc(s){var el=document.createElement('span');el.textContent=s==null?'':String(s);return el.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.style.display='none'},3200)}
function cover(url,title){return url?'<img class="cover" src="'+esc(url)+'" alt="">':'<div class="cover">'+esc((title||'♫').charAt(0).toUpperCase())+'</div>'}
function nav(){var items=[['home','⌂','Inicio'],['search','⌕','Buscar'],['podcasts','♫','Podcasts']];$('nav').innerHTML=items.map(function(x){return '<button data-tab="'+x[0]+'" class="'+(tab===x[0]?'active':'')+'">'+x[1]+'<br>'+x[2]+'</button>'}).join('')}
function draw(){nav();if(tab==='search'){app.innerHTML='<h1>Buscar</h1><input id="searchInput" class="search" type="search" placeholder="Canciones, artistas o álbumes" value="'+esc(query)+'" autocomplete="off"><div class="hero"><b>Tu música</b><div class="hint">Busca en tu biblioteca desde esta sección.</div></div>';var si=$('searchInput');si.addEventListener('input',function(){query=si.value});return}if(tab==='podcasts'){app.innerHTML='<h1>Podcasts</h1><div class="hint" style="margin-bottom:12px">Encuentra programas y escucha sus episodios.</div><input id="podcastInput" class="search" type="search" placeholder="Buscar podcasts" value="'+esc(podcastQuery)+'" autocomplete="off"><div id="podcastResults">'+podcastMarkup()+'</div>';var pi=$('podcastInput');pi.addEventListener('input',function(){podcastQuery=pi.value;clearTimeout(searchTimer);var n=++requestNo;if(!podcastQuery.trim()){podcasts=[];$('podcastResults').innerHTML='';return}$('podcastResults').innerHTML='<div class="empty">Buscando podcasts…</div>';searchTimer=setTimeout(function(){findPodcasts(podcastQuery,n)},350)});return}app.innerHTML='<h1>Inicio</h1><div class="hero"><b>Tu música, en un solo lugar</b><div class="hint" style="margin-top:7px">Explora podcasts en su propia sección, sin mezclar los resultados con tu búsqueda de música.</div><button data-open-podcasts="1" style="margin-top:14px;background:#4cc9e6;color:#04141c;font-weight:700">Explorar podcasts</button></div><div class="hint">La biblioteca musical está disponible desde la versión completa de TuneBox.</div>';}
function podcastMarkup(){if(!podcastQuery.trim())return '';if(!podcasts.length)return '<div class="empty">No se encontraron podcasts.</div>';return '<h2>Resultados</h2><div class="card">'+podcasts.map(function(p,i){return '<div class="row" data-podcast="'+i+'">'+cover(p.art,p.title)+'<div class="meta"><div class="title">'+esc(p.title)+'</div><div class="sub">'+esc(p.artist||'Podcast')+'</div></div><span class="chev">›</span></div>'}).join('')+'</div>'}
function findPodcasts(term,n){fetch('https://tb.local/ps?q='+encodeURIComponent(term),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('search');return r.json()}).then(function(data){if(n!==requestNo||tab!=='podcasts')return;podcasts=((data&&data.results)||[]).map(function(p){return{title:p.collectionName||p.trackName||'Podcast',artist:p.artistName||'',art:p.artworkUrl600||p.artworkUrl100||'',feed:p.feedUrl||''}}).filter(function(p){return p.feed});var box=$('podcastResults');if(box)box.innerHTML=podcasts.length?podcastMarkup():'<div class="empty">No se encontraron podcasts para esta búsqueda.</div>'}).catch(function(){if(n!==requestNo)return;var box=$('podcastResults');if(box)box.innerHTML='<div class="empty">No se pudieron cargar los podcasts. Comprueba la conexión e inténtalo de nuevo.</div>'})}
function openPodcast(index){var p=podcasts[index];if(!p||!p.feed)return;selectedPodcast=p;var body=$('sheetBody');body.innerHTML='<h2>'+esc(p.title)+'</h2><div class="empty">Cargando episodios…</div>';$('sheet').classList.add('show');fetch('https://tb.local/pod?u='+encodeURIComponent(p.feed),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('feed');return r.json()}).then(function(data){feedEpisodes=(data&&data.eps)||[];body.innerHTML='<h2>'+esc(p.title)+'</h2>'+(feedEpisodes.length?feedEpisodes.map(function(ep,i){return '<button data-episode="'+i+'"><span class="title">'+esc(ep.t||'Episodio')+'</span><div class="sub">'+esc(ep.d?duration(ep.d):'Episodio')+'</div></button>'}).join(''):'<div class="empty">No hay episodios disponibles.</div>')}).catch(function(){body.innerHTML='<h2>'+esc(p.title)+'</h2><div class="empty">No se pudo cargar el feed de este podcast.</div>'})}
function duration(n){n=Math.floor(Number(n)||0);return Math.floor(n/60)+':'+('0'+n%60).slice(-2)}
function startEpisode(i){var ep=feedEpisodes[i];if(!ep||!ep.u){toast('Este episodio no tiene un audio disponible.');return}var url=ep.u;if(window.Android)url='https://tb.local/pf?u='+encodeURIComponent(ep.u);current={title:ep.t||'Episodio',podcast:selectedPodcast?selectedPodcast.title:'Podcast',art:selectedPodcast?selectedPodcast.art:''};audio.src=url;$('player').style.display='flex';$('playerTitle').textContent=current.title;$('playerSub').textContent=current.podcast;if(current.art)$('playerArt').innerHTML='<img class="cover" src="'+esc(current.art)+'" alt="">';else $('playerArt').textContent='♫';$('sheet').classList.remove('show');audio.play().then(function(){$('play').textContent='Ⅱ'}).catch(function(){toast('No se pudo iniciar el episodio. Vuelve a tocar reproducir.')})}
$('nav').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;draw()});app.addEventListener('click',function(e){var row=e.target.closest('[data-podcast]');if(row){openPodcast(Number(row.dataset.podcast));return}if(e.target.closest('[data-open-podcasts]')){tab='podcasts';draw()}});$('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))$('sheet').classList.remove('show');var b=e.target.closest('[data-episode]');if(b)startEpisode(Number(b.dataset.episode))});$('play').addEventListener('click',function(){if(audio.paused)audio.play().then(function(){$('play').textContent='Ⅱ'}).catch(function(){toast('No se pudo reproducir el episodio.')});else audio.pause()});audio.addEventListener('play',function(){$('play').textContent='Ⅱ'});audio.addEventListener('pause',function(){$('play').textContent='▶'});audio.addEventListener('error',function(){toast('El feed no permite reproducir este episodio en el dispositivo.')});draw();
})();
</script>
</body>
</html>
