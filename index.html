<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunebox</title>
<style>
:root{--bg:#fff;--card:#f2f2f7;--tx:#111;--mu:#6e6e78;--ac:#1db954;--ln:#e3e3e8;--nav:56px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989f;--ln:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989f;--ln:#2c2c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
#main{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--nav) + 110px)}
h1{font-size:30px;letter-spacing:-.5px;margin:6px 0 12px}h3{margin:22px 0 8px;font-size:19px}
button{font:inherit;color:inherit;background:var(--card);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.pri{background:var(--ac);color:#000;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.chips button{flex:none}.chips .on{background:var(--ac);color:#000;font-weight:600}
input[type=text]{width:100%;background:var(--card);color:var(--tx);border:0;border-radius:12px;padding:12px 14px;font:inherit;margin:6px 0}
.fb{position:relative;display:inline-block;overflow:hidden;border-radius:999px;vertical-align:middle}
.fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.fb.blk{display:block;margin:6px 0}.fb.blk button{width:100%;text-align:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;height:56px;padding-right:8px}
.tile .cv{border-radius:0;width:56px;height:56px}.tile b{font-size:14px;line-height:1.2}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.sc{flex:none;width:140px;cursor:pointer}.sc .cv{width:140px;height:140px;border-radius:10px;font-size:42px}.sc.rd .cv{border-radius:50%}.sc.rd{text-align:center}
.row{display:flex;align-items:center;gap:12px;padding:7px 0}.row.cur .t{color:var(--ac)}
.cv{width:48px;height:48px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.m{flex:1;min-width:0;cursor:pointer}.t,.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a{color:var(--mu);font-size:13px}
.ib{background:none;padding:6px 10px;font-size:20px}.on-h{color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:26px 8px}.card{background:var(--card);border-radius:16px;padding:14px;margin:8px 0}
.hero{display:flex;gap:14px;align-items:flex-end;margin:10px 0 14px}.hero .cv{width:120px;height:120px;border-radius:12px;font-size:40px}
code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:12px}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--ln);z-index:10}
#nav button{flex:1;background:none;border-radius:0;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}#nav button b{font-size:21px;font-weight:400}#nav .on{color:var(--tx)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 8px);height:60px;border-radius:14px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:none;align-items:center;gap:10px;padding:0 6px 0 8px;z-index:11;max-width:704px;margin:0 auto;box-shadow:0 4px 18px #0003;overflow:hidden}
#mini .cv{width:44px;height:44px;border-radius:6px}#mini .pl{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#8884}#mini .pl i{display:block;height:100%;background:var(--tx);width:0}
#np{position:fixed;inset:0;z-index:20;display:none;color:#fff;--tx:#fff;--mu:#ffffffb3;--card:#ffffff26;background:#121212;overflow:hidden}
#np.show{display:block}#cvs{position:absolute;inset:0;width:100%;height:100%}
#npc{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;max-width:560px;margin:0 auto}
#np .hd{display:flex;align-items:center;justify-content:space-between;height:44px}#np .hd small{color:var(--mu);font-size:12px;text-align:center}
#art{width:min(78%,300px);aspect-ratio:1;margin:auto;border-radius:16px;display:grid;place-items:center;font-size:72px;font-weight:700;box-shadow:0 20px 50px #0008;transition:transform .08s}
#nt{font-size:22px;font-weight:700}#sc{width:100%;accent-color:#fff;margin:12px 0 0}.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.ctl .ib{font-size:24px;color:#fff}.big{width:66px;height:66px;border-radius:50%;background:#fff;color:#000;font-size:26px;padding:0}
.ex{display:flex;justify-content:space-around;margin-top:4px}.ex button{font-size:12px;padding:6px 10px;background:#ffffff1f}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:40}.sheet.show{display:flex}
.sheet>div{background:var(--bg);color:var(--tx);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet button{width:100%;margin:4px 0;text-align:left}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;display:none;max-width:90%;font-size:14px;text-align:center}
</style>
</head>
<body>
<div id="main"></div>
<div id="mini"><div class="cv" id="mcv"></div><div class="m" id="mtx"><div class="t" id="mt"></div><div class="a" id="ma"></div></div><button class="ib" id="mh">♡</button><button class="ib" id="mp" style="font-size:24px">▶</button><div class="pl"><i id="mpb"></i></div></div>
<div id="np"><canvas id="cvs"></canvas><div id="npc">
  <div class="hd"><button class="ib" id="npx" style="color:#fff">⌄</button><small>REPRODUCIENDO<br><b style="color:#fff" id="nal"></b></small><button class="ib" id="nmo" style="color:#fff">⋯</button></div>
  <div id="art"></div>
  <div style="display:flex;align-items:center;gap:8px"><div class="m" style="cursor:default"><div id="nt" class="t"></div><div class="a" id="na"></div></div><button class="ib" id="nh" style="font-size:26px">♡</button></div>
  <input type="range" id="sc" min="0" max="1000" value="0"><div class="tm"><span id="tc">0:00</span><span id="td">0:00</span></div>
  <div class="ctl"><button class="ib" id="ns">⇄</button><button class="ib" id="npv">⏮</button><button class="big" id="np2">▶</button><button class="ib" id="nx">⏭</button><button class="ib" id="nr">↻</button></div>
  <div class="ex"><button id="bq">Cola</button><button id="bsp">1×</button><button id="bsl">Temporizador</button><button id="bcv">Canvas ✓</button></div>
</div></div>
<div class="sheet" id="sheet"><div id="sb"></div></div><div id="toast"></div><audio id="au" crossorigin="anonymous"></audio><nav id="nav"></nav>
<script>
var lib=[],lists=[],likes={},recents=[],tab="home",chip="Todo",q="",open=null,queue=[],qi=-1,playing=false,shuf=false,rep=false,speed=1,sleepM=0,sleepH=null,cvOn=true,drag=false,tsel=null,Ls=[],bass=0,hist=[];
var $=function(i){return document.getElementById(i)},au=$("au"),AN=!!window.Android;
function ld(){try{var d=JSON.parse(localStorage.getItem("tb4")||"null");if(d){lists=d.lists||[];likes=d.likes||{};recents=d.recents||[]}}catch(e){}}
function sv(){try{localStorage.setItem("tb4",JSON.stringify({lists:lists,likes:likes,recents:recents}))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function norm(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function hue(s){var h=0;s=s||"?";for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function bg(s){var h=hue(s);return"linear-gradient(135deg,hsl("+h+",62%,50%),hsl("+(h+40)+",60%,30%))"}
function fmt(s){s=Math.round(s||0);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3500)}
function mk(o){o.title=o.title||"Sin título";o.artist=o.artist&&o.artist!="<unknown>"?o.artist:"Artista desconocido";o.album=o.album&&o.album!="<unknown>"?o.album:"Álbum desconocido";o.nt=norm(o.title);o.na=norm(o.artist);o.k=o.nt+"|"+o.na;return o}
function setLib(a){var seen={};lib=a.filter(function(t){if(seen[t.k])return false;return seen[t.k]=1}).sort(function(x,y){return x.title.localeCompare(y.title)});render()}
function find(t,a){var nt=norm(t),na=norm(a||"");return lib.filter(function(x){return x.nt==nt&&(!na||x.na.indexOf(na)>-1||na.indexOf(x.na)>-1)})[0]||lib.filter(function(x){return x.nt==nt})[0]||null}

/* Scan the device (Android MediaStore) or pick audio files (browser) */
window.scanNative=function(){if(!AN)return;try{var a=JSON.parse(Android.scan());setLib(a.map(function(o){o.src="https://tb.local/a/"+o.mid;return mk(o)}));toast(a.length+" canciones encontradas en el dispositivo")}catch(e){toast("No se pudo escanear. Revisa el permiso de audio")}};
function addFiles(fs){var a=lib.slice();fs.forEach(function(f){if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name))return;var n=f.name.replace(/\.[^.]+$/,""),p=n.split(" - ");a.push(mk({title:p.length>1?p.slice(1).join(" - "):n,artist:p.length>1?p[0]:"",album:"",src:URL.createObjectURL(f)}))});setLib(a);toast("Biblioteca: "+lib.length+" canciones")}

/* CSV + JSON import: builds playlists and matches rows against the scanned library */
function parseCSV(t){var rows=[],r=[],f="",q=false,i,c;t=t.replace(/^\uFEFF/,"");
  for(i=0;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","||c==";"){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
function fromCSV(t){var rows=parseCSV(t);if(rows.length<2)return[];var h=rows[0].map(function(x){return x.trim().toLowerCase()});
  function col(n){for(var i=0;i<h.length;i++)if(n.indexOf(h[i])>-1)return i;return -1}
  var ct=col(["title","titulo","título","name","nombre","track","song","cancion","canción"]),ca=col(["artist","artista","artists"]),cl=col(["playlist","lista"]),cb=col(["album","álbum"]);if(ct<0)return[];
  return rows.slice(1).map(function(r){return{t:(r[ct]||"").trim(),a:ca>-1?(r[ca]||"").trim():"",b:cb>-1?(r[cb]||"").trim():"",l:cl>-1?(r[cl]||"").trim():""}}).filter(function(x){return x.t})}
function fromJSON(t,fn){var j=JSON.parse(t),out=[];
  function tr(a,l){(a||[]).forEach(function(x){if(typeof x=="string")out.push({t:x,a:"",l:l});else{var o=x.track||x;out.push({t:o.title||o.name||o.titulo||"",a:o.artist||o.artista||(o.artists&&o.artists[0]&&(o.artists[0].name||o.artists[0]))||"",l:l})}})}
  if(Array.isArray(j))tr(j,"");else if(j.playlists)j.playlists.forEach(function(p){tr(p.tracks||p.items||p.songs,p.name||p.title||fn)});else tr(j.tracks||j.items||j.songs,j.name||j.title||"");return out.filter(function(x){return x.t})}
function importMeta(name,rows){if(!rows.length){toast("No encontré canciones en ese archivo");return}
  var base=name.replace(/\.[^.]+$/,""),g={},hit=0;rows.forEach(function(r){var l=r.l||base;(g[l]=g[l]||[]).push({t:r.t,a:r.a});if(find(r.t,r.a))hit++});
  Object.keys(g).forEach(function(l){var p=lists.filter(function(x){return x.name==l})[0];if(!p){p={name:l,items:[]};lists.push(p)}g[l].forEach(function(i){if(!p.items.some(function(z){return norm(z.t)==norm(i.t)}))p.items.push(i)})});
  sv();render();toast(Object.keys(g).length+" playlist(s). "+hit+" de "+rows.length+" canciones encontradas en tu biblioteca")}
document.addEventListener("change",function(e){var i=e.target;if(!i||i.type!="file"||!i.files||!i.files.length)return;var fs=[].slice.call(i.files),k=i.dataset.k;i.value="";
  if(k=="audio")return addFiles(fs);
  var f=fs[0],r=new FileReader();r.onerror=function(){toast("No se pudo leer el archivo")};
  r.onload=function(){var t=r.result;try{var js=/\.json$/i.test(f.name)||/^\s*[\[{]/.test(t);importMeta(f.name,js?fromJSON(t,f.name.replace(/\.[^.]+$/,"")):fromCSV(t))}catch(x){toast("El archivo no tiene un formato válido")}};r.readAsText(f)});

/* Views */
function cover(s,c){return '<div class="cv" style="background:'+bg(s)+'">'+esc((s[0]||"?").toUpperCase())+(c||"")+'</div>'}
function lst(a){Ls.push(a);return Ls.length-1}
function row(t,l,i){var cur=queue[qi]&&queue[qi].k==t.k,lk=likes[t.k];return '<div class="row'+(cur?' cur':'')+'">'+cover(t.album)+'<div class="m" data-p="'+l+'_'+i+'"><div class="t">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+(t.dur?" · "+fmt(t.dur):"")+'</div></div><button class="ib'+(lk?' on-h':'')+'" data-like="'+t.k+'">'+(lk?'♥':'♡')+'</button><button class="ib" data-more="'+t.k+'">⋯</button></div>'}
function list(a){var l=lst(a);return a.length?a.map(function(t,i){return row(t,l,i)}).join(""):'<div class="empty">Nada por aquí todavía.</div>'}
function shelf(a,cls){var l=lst(a);return '<div class="shelf">'+a.map(function(t,i){return '<div class="sc '+(cls||"")+'" data-p="'+l+'_'+i+'">'+cover(t.album)+'<div class="t" style="margin-top:6px;font-weight:600">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+'</div></div>'}).join("")+'</div>'}
function uniq(f){var m={};lib.forEach(function(t){(m[t[f]]=m[t[f]]||[]).push(t)});return m}
function plTracks(p){return p.items.map(function(i){return find(i.t,i.a)}).filter(Boolean)}
function colOf(o){if(o.t=="album")return{n:o.k,s:"Álbum",tr:lib.filter(function(x){return x.album==o.k})};if(o.t=="artist")return{n:o.k,s:"Artista",tr:lib.filter(function(x){return x.artist==o.k})};
  if(o.t=="fav")return{n:"Canciones que te gustan",s:"Playlist",tr:lib.filter(function(x){return likes[x.k]})};var p=lists[o.k];return{n:p.name,s:"Playlist · "+p.items.length+" elementos",tr:plTracks(p)}}
function greet(){var h=new Date().getHours();return h<12?"Buenos días":h<20?"Buenas tardes":"Buenas noches"}
function importCard(){return '<div class="card"><b>Tu música</b><div class="a" style="margin:4px 0 10px">'+(AN?'Escanea los MP3 y otros audios del teléfono.':'Elige los archivos de audio de tu dispositivo.')+'</div>'+(AN?'<button class="pri" data-scan="1">Escanear dispositivo</button> ':'<span class="fb"><button class="pri">Elegir audios</button><input type="file" accept="audio/*" multiple data-k="audio"></span> ')+'<span class="fb"><button>Importar CSV / JSON</button><input type="file" data-k="meta"></span><div class="a" style="margin-top:8px">CSV: <code>title, artist, playlist</code>. JSON: lista de canciones o <code>{"playlists":[{"name":"…","tracks":[…]}]}</code>.</div></div>'}
function render(){Ls=[];var h="",a;
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t==tab)});
  if(tab=="search"){h='<h1>Buscar</h1><input type="text" id="q" placeholder="Canciones, artistas o álbumes" value="'+esc(q)+'"><div id="res">'+res()+'</div>'}
  else if(tab=="lib"){h='<h1>Tu biblioteca</h1>'+importCard()+'<h3>Playlists</h3>'+(lists.length?lists.map(function(p,i){return '<div class="row">'+cover(p.name,"")+'<div class="m" data-open="list_'+i+'"><div class="t">'+esc(p.name)+'</div><div class="a">'+plTracks(p).length+' de '+p.items.length+' en tu biblioteca</div></div><button class="ib" data-del="'+i+'">✕</button></div>'}).join(""):'<div class="empty">Importa un CSV o JSON, o crea una desde ⋯ en una canción.</div>')+'<div style="margin-top:8px"><button data-newpl="1">＋ Nueva playlist</button></div>'}
  else if(open){var c=colOf(open),l=lst(c.tr);h='<button data-back="1">← Volver</button><div class="hero">'+cover(c.n)+'<div><div class="a">'+c.s+'</div><h1 style="margin:2px 0">'+esc(c.n)+'</h1><div class="a">'+c.tr.length+' canciones</div></div></div><div style="margin-bottom:8px"><button class="pri" data-pl="'+l+'">▶ Reproducir</button> <button data-pl="'+l+'s">⇄ Aleatorio</button></div>'+list(c.tr)}
  else{h='<h1>'+greet()+'</h1><div class="chips">'+["Todo","Canciones","Playlists","Artistas","Álbumes"].map(function(g){return '<button data-chip="'+g+'" class="'+(g==chip?'on':'')+'">'+g+'</button>'}).join("")+'</div>';
    if(!lib.length)h+=importCard();
    else if(chip=="Todo"){var rec=recents.map(function(k){return lib.filter(function(x){return x.k==k})[0]}).filter(Boolean).slice(0,10),ar=uniq("artist"),al=uniq("album");
      h+='<div class="grid"><div class="tile" data-open="fav_0"><div class="cv" style="background:linear-gradient(135deg,#5b3df5,#b9a8ff)">♥</div><b>Te gustan</b></div><div class="tile" data-shuffle="1"><div class="cv" style="background:linear-gradient(135deg,#1db954,#0b6b30)">⇄</div><b>Aleatorio</b></div>'+lists.slice(0,4).map(function(p,i){return '<div class="tile" data-open="list_'+i+'">'+cover(p.name)+'<b>'+esc(p.name)+'</b></div>'}).join("")+'</div>'+
      (rec.length?'<h3>Escuchado recientemente</h3>'+shelf(rec):'')+'<h3>Tus artistas</h3><div class="shelf">'+Object.keys(ar).slice(0,12).map(function(k){return '<div class="sc rd" data-open="artist_'+esc(k)+'">'+cover(k)+'<div class="t" style="margin-top:6px;font-weight:600">'+esc(k)+'</div><div class="a">Artista</div></div>'}).join("")+'</div>'+
      '<h3>Tus álbumes</h3><div class="shelf">'+Object.keys(al).slice(0,12).map(function(k){return '<div class="sc" data-open="album_'+esc(k)+'">'+cover(k)+'<div class="t" style="margin-top:6px;font-weight:600">'+esc(k)+'</div><div class="a">'+al[k].length+' canciones</div></div>'}).join("")+'</div>'}
    else if(chip=="Canciones")h+=list(lib);
    else if(chip=="Playlists")h+=lists.length?lists.map(function(p,i){return '<div class="row">'+cover(p.name)+'<div class="m" data-open="list_'+i+'"><div class="t">'+esc(p.name)+'</div><div class="a">'+p.items.length+' elementos</div></div></div>'}).join(""):'<div class="empty">Sin playlists.</div>';
    else{var m=uniq(chip=="Artistas"?"artist":"album"),t=chip=="Artistas"?"artist":"album";h+=Object.keys(m).map(function(k){return '<div class="row">'+cover(k)+'<div class="m" data-open="'+t+'_'+esc(k)+'"><div class="t">'+esc(k)+'</div><div class="a">'+m[k].length+' canciones</div></div></div>'}).join("")}}
  $("main").innerHTML=h}
function res(){if(!q)return '<div class="empty">Busca entre '+lib.length+' canciones.</div>';var k=q.toLowerCase();return list(lib.filter(function(t){return(t.title+" "+t.artist+" "+t.album).toLowerCase().indexOf(k)>-1}))}
$("nav").innerHTML=[["home","⌂","Inicio"],["search","⌕","Buscar"],["lib","▤","Biblioteca"]].map(function(x){return '<button data-t="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>'}).join("");
$("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.t;open=null;render();scrollTo(0,0)};
window.goBack=function(){if($("sheet").classList.contains("show"))closeSheet();else if($("np").classList.contains("show"))$("np").classList.remove("show");else if(open){open=null;render()}else if(tab!="home"){tab="home";render()}};
$("main").oninput=function(e){if(e.target.id=="q"){q=e.target.value;$("res").innerHTML=res()}};
$("main").onclick=function(e){var t=e.target,g;
  if(g=t.closest("[data-more]")){sheetT(g.dataset.more);return}
  if(g=t.closest("[data-like]")){likes[g.dataset.like]?delete likes[g.dataset.like]:likes[g.dataset.like]=1;sv();render();ui();return}
  if(g=t.closest("[data-p]")){var p=g.dataset.p.split("_");play(Ls[+p[0]],+p[1]);return}
  if(g=t.closest("[data-pl]")){var s=g.dataset.pl.slice(-1)=="s",a=Ls[parseInt(g.dataset.pl)];if(!a.length)return toast("No hay canciones");shuf=s;play(a,s?Math.floor(Math.random()*a.length):0);return}
  if(g=t.closest("[data-open]")){var p=g.dataset.open,i=p.indexOf("_");open={t:p.slice(0,i),k:p.slice(i+1)};if(open.t=="list")open.k=+open.k;tab=(open.t=="list"&&tab=="lib")?"lib":tab;render();scrollTo(0,0);return}
  if(g=t.closest("[data-chip]")){chip=g.dataset.chip;render();return}
  if(t.closest("[data-back]")){open=null;render();return}
  if(t.closest("[data-shuffle]")){shuf=true;play(lib,Math.floor(Math.random()*lib.length));return}
  if(t.closest("[data-scan]")){scanNative();return}
  if(g=t.closest("[data-del]")){lists.splice(+g.dataset.del,1);sv();render();return}
  if(t.closest("[data-newpl]")){sheetNew(null)}};

/* Sheets: track menu, new playlist, queue */
function closeSheet(){$("sheet").classList.remove("show")}$("sheet").onclick=function(e){if(e.target==this)closeSheet()};
function sheetT(k){tsel=k;var t=lib.filter(function(x){return x.k==k})[0];if(!t)return;
  $("sb").innerHTML='<b>'+esc(t.title)+'</b><div class="a" style="margin-bottom:8px">'+esc(t.artist)+'</div><button data-s="q">Añadir a la cola</button><button data-s="n">Reproducir a continuación</button><button data-s="f">'+(likes[k]?'Quitar de favoritas':'Añadir a favoritas')+'</button><div class="a" style="margin:8px 0 2px">Añadir a playlist</div>'+lists.map(function(p,i){return '<button data-s="p'+i+'">'+esc(p.name)+'</button>'}).join("")+'<button data-s="np" class="pri">＋ Nueva playlist</button>';$("sheet").classList.add("show")}
function sheetNew(k){$("sb").innerHTML='<b>Nueva playlist</b><input type="text" id="pn" placeholder="Nombre"><button class="pri" id="pc" data-k="'+(k||"")+'">Crear</button>';$("sheet").classList.add("show");setTimeout(function(){$("pn").focus()},60)}
$("sb").onclick=function(e){var b=e.target.closest("button");if(!b)return;var s=b.dataset.s,t=lib.filter(function(x){return x.k==tsel})[0];
  if(b.id=="pc"){var n=$("pn").value.trim();if(!n)return;var p={name:n,items:[]},k=b.dataset.k,x=k&&lib.filter(function(y){return y.k==k})[0];if(x)p.items.push({t:x.title,a:x.artist});lists.push(p);sv();closeSheet();render();return}
  if(!s)return;
  if(s=="q"){queue.push(t);toast("Añadida a la cola")}else if(s=="n"){queue.splice(qi+1,0,t);toast("Sonará a continuación")}
  else if(s=="f"){likes[tsel]?delete likes[tsel]:likes[tsel]=1;sv();ui()}
  else if(s=="np"){sheetNew(tsel);return}
  else if(s[0]=="p"){var p=lists[+s.slice(1)];if(!p.items.some(function(z){return norm(z.t)==t.nt}))p.items.push({t:t.title,a:t.artist});sv();toast("Añadida a "+p.name)}
  closeSheet();render()};
$("nmo").onclick=function(){if(queue[qi])sheetT(queue[qi].k)};
$("bq").onclick=function(){var up=queue.slice(qi+1);$("sb").innerHTML='<b>Cola</b><div class="a">Sonando: '+esc(queue[qi]?queue[qi].title:"")+'</div>'+(up.length?up.slice(0,60).map(function(t,i){return '<div class="row">'+cover(t.album)+'<div class="m" data-jq="'+(qi+1+i)+'"><div class="t">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+'</div></div></div>'}).join(""):'<div class="empty">No hay más canciones en la cola.</div>');$("sheet").classList.add("show")};
document.addEventListener("click",function(e){var g=e.target.closest("[data-jq]");if(g&&$("sb").contains(g)){qi=+g.dataset.jq;load();closeSheet()}});

/* Player */
function play(a,i){queue=a.slice();qi=i;load()}
function load(){var t=queue[qi];if(!t)return;au.src=t.src;au.playbackRate=speed;au.play().catch(function(){toast("No se pudo reproducir este archivo")});
  recents=[t.k].concat(recents.filter(function(k){return k!=t.k})).slice(0,30);sv();meta();ui();if($("main"))render()}
function toggle(){if(!queue[qi]){if(lib.length)play(lib,0);else toast("Primero agrega música");return}au.paused?au.play():au.pause()}
function next(){if(!queue.length)return;qi=shuf&&queue.length>1?(function(){var n;do{n=Math.floor(Math.random()*queue.length)}while(n==qi);return n})():(qi+1)%queue.length;load()}
function prev(){if(!queue.length)return;if(au.currentTime>3){au.currentTime=0;return}qi=(qi-1+queue.length)%queue.length;load()}
au.onplay=au.onpause=function(){playing=!au.paused;if(AN)try{Android.keep(playing,queue[qi]?queue[qi].title:"")}catch(e){}ui()};
au.onended=function(){if(rep){au.currentTime=0;au.play()}else next()};au.ontimeupdate=ui;au.onerror=function(){toast("Formato no compatible. Saltando…");setTimeout(next,600)};
function meta(){if(!("mediaSession" in navigator)||!queue[qi])return;var t=queue[qi];try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album});
  var m=navigator.mediaSession;m.setActionHandler("play",toggle);m.setActionHandler("pause",toggle);m.setActionHandler("nexttrack",next);m.setActionHandler("previoustrack",prev);m.setActionHandler("seekto",function(d){au.currentTime=d.seekTime})}catch(e){}}
function ui(){var t=queue[qi];$("mini").style.display=t?"flex":"none";if(!t)return;var d=au.duration||t.dur||0,c=au.currentTime||0,lk=likes[t.k],h=hue(t.album);
  $("mt").textContent=$("nt").textContent=t.title;$("ma").textContent=$("na").textContent=t.artist;$("nal").textContent=t.album;
  $("mp").textContent=$("np2").textContent=au.paused?"▶":"⏸";$("mh").textContent=$("nh").textContent=lk?"♥":"♡";$("mh").className="ib"+(lk?" on-h":"");$("nh").style.color=lk?"var(--ac)":"#fff";
  $("mcv").style.background=$("art").style.background=bg(t.album);$("mcv").textContent=(t.title[0]||"?").toUpperCase();$("art").textContent=(t.title[0]||"?").toUpperCase();
  $("mpb").style.width=(d?c/d*100:0)+"%";if(!drag)$("sc").value=d?c/d*1000:0;$("tc").textContent=fmt(c);$("td").textContent=fmt(d);
  $("ns").style.color=shuf?"var(--ac)":"#fff";$("nr").style.color=rep?"var(--ac)":"#fff"}
$("mp").onclick=$("np2").onclick=toggle;$("nx").onclick=next;$("npv").onclick=prev;
$("ns").onclick=function(){shuf=!shuf;ui()};$("nr").onclick=function(){rep=!rep;ui()};
$("mh").onclick=$("nh").onclick=function(){var t=queue[qi];if(!t)return;likes[t.k]?delete likes[t.k]:likes[t.k]=1;sv();ui()};
$("mtx").onclick=$("mcv").onclick=function(){$("np").classList.add("show");rs()};$("npx").onclick=function(){$("np").classList.remove("show")};
$("sc").oninput=function(){drag=true;$("tc").textContent=fmt(this.value/1000*(au.duration||0))};$("sc").onchange=function(){drag=false;if(au.duration)au.currentTime=this.value/1000*au.duration};
$("bsp").onclick=function(){speed=speed==1?1.25:speed==1.25?1.5:speed==1.5?.75:1;au.playbackRate=speed;this.textContent=speed+"×"};
$("bsl").onclick=function(){sleepM=sleepM==0?15:sleepM==15?30:sleepM==30?60:0;clearTimeout(sleepH);if(sleepM)sleepH=setTimeout(function(){au.pause();sleepM=0;$("bsl").textContent="Temporizador"},sleepM*60000);this.textContent=sleepM?"Apagar en "+sleepM+" min":"Temporizador"};
$("bcv").onclick=function(){cvOn=!cvOn;this.textContent="Canvas "+(cvOn?"✓":"✗")};

/* Canvas: generative visuals that react to the music (Web Audio analyser) */
var cv=$("cvs"),cx=cv.getContext("2d"),ac=null,an=null,fd=null,tt=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",rs);
au.addEventListener("play",function(){if(ac)return;try{var C=window.AudioContext||window.webkitAudioContext;ac=new C();var s=ac.createMediaElementSource(au);an=ac.createAnalyser();an.fftSize=128;fd=new Uint8Array(an.frequencyBinCount);s.connect(an);an.connect(ac.destination)}catch(e){ac=null}});
function draw(){requestAnimationFrame(draw);if(!$("np").classList.contains("show"))return;cx.globalCompositeOperation="source-over";cx.fillStyle="#121212";cx.fillRect(0,0,cv.width,cv.height);if(!cvOn||!queue[qi])return;
  var b=0;if(an&&!au.paused){an.getByteFrequencyData(fd);for(var i=0;i<8;i++)b+=fd[i];b=b/8/255}else if(!au.paused)b=.25+.15*Math.sin(tt*6);bass+=(b-bass)*.25;tt+=.006+bass*.03;
  var h=hue(queue[qi].album),w=cv.width,H=cv.height;cx.globalCompositeOperation="lighter";
  for(var n=0;n<6;n++){var x=w*(.5+.4*Math.sin(tt*(.6+n*.21)+n)),y=H*(.5+.4*Math.cos(tt*(.5+n*.17)+n*2)),r=w*(.35+.4*bass+.04*n),g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,"hsla("+(h+n*28)+",85%,55%,.45)");g.addColorStop(1,"hsla("+(h+n*28)+",85%,55%,0)");cx.fillStyle=g;cx.fillRect(0,0,w,H)}
  $("art").style.transform="scale("+(1+bass*.06)+")"}
rs();draw();ld();render();if(AN)scanNative();
</script>
