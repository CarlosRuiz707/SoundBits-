<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoundBits</title>
<style>
:root{color-scheme:dark;--bg:#121212;--card:#202020;--tx:#f5f5f5;--mu:#aaa;--ac:#1ed760;--nav:60px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}#main{max-width:720px;margin:auto;padding:20px 16px 150px}h1{font-size:28px;margin:4px 0 16px}h3{font-size:20px;margin:24px 0 10px}button{font:inherit;color:inherit;background:var(--card);border:0;border-radius:12px;padding:12px;cursor:pointer}.search{width:100%;margin:0 0 12px;border:0;border-radius:12px;padding:14px;background:#292929;color:white;font:inherit}.card{background:var(--card);padding:12px 16px;border-radius:14px}.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff12;cursor:pointer}.row:last-child{border:0}.cover{width:54px;height:54px;border-radius:7px;flex:none;object-fit:cover;background:linear-gradient(135deg,#405b48,#183326);display:grid;place-items:center;font-size:23px}.meta{min-width:0;flex:1}.title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:var(--mu);font-size:22px}#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;background:#101010f2;border-top:1px solid #ffffff16}#nav button{flex:1;max-width:240px;background:none;border-radius:0;color:var(--mu);font-size:12px}#nav button.active{color:var(--ac)}#sheet{position:fixed;inset:0;z-index:10;background:#0009;display:none;align-items:flex-end}#sheet.show{display:flex}#sheet>section{width:100%;max-width:720px;margin:auto;background:#202020;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}#sheet button{display:block;width:100%;text-align:left;background:transparent;border-bottom:1px solid #ffffff18;border-radius:0;padding:14px 2px}#player{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px);z-index:5;display:none;align-items:center;gap:10px;background:#303030;border-radius:12px;padding:8px 10px;box-shadow:0 4px 20px #0008}#player .cover{width:42px;height:42px}#play{background:none;font-size:22px;padding:8px}#toast{display:none;position:fixed;z-index:20;top:20px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:10px 16px;border-radius:10px;font-weight:600}.empty{text-align:center;color:var(--mu);padding:20px 8px}
</style>
</head>
<body>
<main id="main"></main><div id="player"><div id="playerArt" class="cover">♫</div><div class="meta"><div id="playerTitle" class="title"></div><div id="playerSub" class="sub"></div></div><button id="play" aria-label="Reproducir">▶</button></div><nav id="nav"></nav><div id="sheet"><section id="sheetBody"></section></div><div id="toast"></div><audio id="audio" preload="none" playsinline></audio>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)},app=$('main'),audio=$('audio'),tab='home',query='',podcasts=[],feedEpisodes=[],requestNo=0,searchTimer=null,current={};
function esc(s){var el=document.createElement('span');el.textContent=s==null?'':String(s);return el.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(msg){var t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.style.display='none'},3000)}
function art(url,title){return url?'<img class="cover" src="'+esc(url)+'" alt="">':'<div class="cover">'+esc((title||'♫').charAt(0).toUpperCase())+'</div>'}
function nav(){ $('nav').innerHTML=['home','search'].map(function(t){return '<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'">'+(t==='home'?'⌂':'⌕')+'<br>'+(t==='home'?'Inicio':'Buscar')+'</button>'}).join(''); }
function draw(){nav();if(tab==='search'){app.innerHTML='<h1>Buscar</h1><input id="searchInput" class="search" type="search" placeholder="Busca podcasts" value="'+esc(query)+'" autocomplete="off"><div id="searchResults">'+podcastMarkup()+'</div>';var input=$('searchInput');input.addEventListener('input',function(){query=input.value;clearTimeout(searchTimer);var n=++requestNo;if(!query.trim()){podcasts=[];$('searchResults').innerHTML='';return}searchTimer=setTimeout(function(){findPodcasts(query,n)},350)});}else{app.innerHTML='<h1>Inicio</h1><div class="card">Busca y escucha podcasts desde la pestaña Buscar.</div>';}}
function podcastMarkup(){if(!query.trim())return '';if(!podcasts.length)return '<div class="empty">Buscando podcasts…</div>';return '<h3>Podcasts</h3><div class="card">'+podcasts.map(function(p,i){return '<div class="row" data-podcast="'+i+'">'+art(p.art,p.title)+'<div class="meta"><div class="title">'+esc(p.title)+'</div><div class="sub">'+esc(p.artist||'Podcast')+'</div></div><span class="chev">›</span></div>'}).join('')+'</div>'}
function findPodcasts(term,n){fetch('https://tb.local/ps?q='+encodeURIComponent(term),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('search');return r.json()}).then(function(data){if(n!==requestNo)return;podcasts=((data&&data.results)||[]).map(function(p){return{title:p.collectionName||p.trackName||'Podcast',artist:p.artistName||'',art:p.artworkUrl600||p.artworkUrl100||'',feed:p.feedUrl||''}}).filter(function(p){return p.feed});var box=$('searchResults');if(box)box.innerHTML=podcastMarkup();}).catch(function(){if(n!==requestNo)return;podcasts=[];var box=$('searchResults');if(box)box.innerHTML='<div class="empty">No se pudieron cargar los podcasts. Comprueba la conexión e inténtalo de nuevo.</div>';});}
function openPodcast(index){var p=podcasts[index];if(!p||!p.feed)return;var body=$('sheetBody');body.innerHTML='<h3>'+esc(p.title)+'</h3><div class="empty">Cargando episodios…</div>';$('sheet').classList.add('show');fetch('https://tb.local/pod?u='+encodeURIComponent(p.feed),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('feed');return r.json()}).then(function(data){feedEpisodes=(data&&data.eps)||[];body.innerHTML='<h3>'+esc(p.title)+'</h3>'+(feedEpisodes.length?feedEpisodes.map(function(ep,i){return '<button data-episode="'+i+'"><span class="title">'+esc(ep.t||'Episodio')+'</span><div class="sub">'+esc(ep.d?duration(ep.d):'Episodio')+'</div></button>'}).join(''):'<div class="empty">No hay episodios disponibles.</div>');}).catch(function(){body.innerHTML='<h3>'+esc(p.title)+'</h3><div class="empty">No se pudo cargar el feed de este podcast.</div>';});}
function duration(n){n=Math.floor(Number(n)||0);return Math.floor(n/60)+':'+('0'+n%60).slice(-2)}
function startEpisode(i){var ep=feedEpisodes[i];if(!ep||!ep.u){toast('Este episodio no tiene un audio disponible.');return}var url=ep.u;
// Android sirve los feeds desde su proxy local, preservando rangos y evitando fallos CORS del WebView.
if(window.Android)url='https://tb.local/pf?u='+encodeURIComponent(ep.u);
current={title:ep.t||'Episodio',podcast:(podcasts.filter(function(p){return p.feed})[0]||{}).title||'Podcast',art:(podcasts.filter(function(p){return p.feed})[0]||{}).art||''};audio.src=url;$('player').style.display='flex';$('playerTitle').textContent=current.title;$('playerSub').textContent=current.podcast;if(current.art)$('playerArt').innerHTML='<img class="cover" src="'+esc(current.art)+'" alt="">';else $('playerArt').textContent='♫';$('sheet').classList.remove('show');audio.play().then(function(){$('play').textContent='Ⅱ'}).catch(function(){toast('No se pudo reproducir el episodio. Comprueba la conexión.');});}
$('nav').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;draw();});
app.addEventListener('click',function(e){var row=e.target.closest('[data-podcast]');if(row)openPodcast(Number(row.dataset.podcast));});
$('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))$('sheet').classList.remove('show');var b=e.target.closest('[data-episode]');if(b)startEpisode(Number(b.dataset.episode));});
$('play').addEventListener('click',function(){if(audio.paused)audio.play().then(function(){$('play').textContent='Ⅱ'}).catch(function(){toast('No se pudo reproducir.');});else audio.pause();});
audio.addEventListener('play',function(){$('play').textContent='Ⅱ'});audio.addEventListener('pause',function(){$('play').textContent='▶'});audio.addEventListener('error',function(){toast('Error de audio: este feed no permitió reproducir el episodio.');});
draw();
})();
</script>
</body>
</html>
