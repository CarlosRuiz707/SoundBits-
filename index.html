<style>
:root{--bg:#fff;--card:#f2f2f7;--tx:#111;--mu:#6e6e78;--ac:#ff0000;--ln:#e3e3e8;--nav:56px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989f;--ln:#2c2c2e}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
#main{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--nav) + 110px)}
h1{font-size:30px;letter-spacing:-.5px;margin:6px 0 12px}h3{margin:22px 0 8px;font-size:19px}
button{font:inherit;color:inherit;background:var(--card);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.pri{background:var(--ac);color:#000;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.chips button{flex:none}.chips .on{background:var(--ac);color:#000;font-weight:600}
input[type=text]{width:100%;background:var(--card);color:var(--tx);border:0;border-radius:12px;padding:12px 14px;font:inherit;margin:6px 0}
.fb{position:relative;display:inline-block;overflow:hidden;border-radius:999px;vertical-align:middle}
.fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.fb.blk{display:block;margin:6px 0}.fb.blk button{width:100%;text-align:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;height:56px;padding-right:8px}
.tile .cv{border-radius:0;width:56px;height:56px}.tile b{font-size:14px;line-height:1.2}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.sc{flex:none;width:140px;cursor:pointer}.sc .cv{width:140px;height:140px;border-radius:10px;font-size:42px}.sc.rd .cv{border-radius:50%}.sc.rd{text-align:center}
.row{display:flex;align-items:center;gap:12px;padding:7px 0}.row.cur .t{color:var(--ac)}
.cv{position:relative;overflow:hidden;width:48px;height:48px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}.cv img,#art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m{flex:1;min-width:0;cursor:pointer}.t,.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a{color:var(--mu);font-size:13px}
.ib{background:none;padding:6px 10px;font-size:20px}.on-h{color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:26px 8px}.card{background:var(--card);border-radius:16px;padding:14px;margin:8px 0}
.hero{display:flex;gap:14px;align-items:flex-end;margin:10px 0 14px}.hero .cv{width:120px;height:120px;border-radius:12px;font-size:40px}
code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:12px}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--ln);z-index:10}
#nav button{flex:1;background:none;border-radius:0;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}#nav button b{font-size:21px;font-weight:400}#nav .on{color:var(--tx)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 8px);height:60px;border-radius:14px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:none;align-items:center;gap:10px;padding:0 6px 0 8px;z-index:11;max-width:704px;margin:0 auto;box-shadow:0 4px 18px #0003;overflow:hidden}
#mini .cv{width:44px;height:44px;border-radius:6px}#mini .pl{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#8884}#mini .pl i{display:block;height:100%;background:var(--tx);width:0}
#np{position:fixed;inset:0;z-index:20;display:none;color:#fff;--tx:#fff;--mu:#ffffffb3;--card:#ffffff26;background:#121212;overflow:hidden}
#np.show{display:block}#cvs{position:absolute;inset:0;width:100%;height:100%}
#npc{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;max-width:560px;margin:0 auto}
#np .hd{display:flex;align-items:center;justify-content:space-between;height:44px}#np .hd small{color:var(--mu);font-size:12px;text-align:center}
#art{position:relative;overflow:hidden;width:min(78%,300px);aspect-ratio:1;margin:auto;border-radius:16px;display:grid;place-items:center;font-size:72px;font-weight:700;box-shadow:0 20px 50px #0008;transition:transform .08s}
#nt{font-size:22px;font-weight:700}#sc{width:100%;accent-color:#fff;margin:12px 0 0}.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.ctl .ib{font-size:24px;color:#fff}.big{width:66px;height:66px;border-radius:50%;background:#fff;color:#000;font-size:26px;padding:0}
.ex{display:flex;justify-content:space-around;margin-top:4px}.ex button{font-size:12px;padding:6px 10px;background:#ffffff1f}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:40}.sheet.show{display:flex}
.sheet>div{background:var(--bg);color:var(--tx);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet button{width:100%;margin:4px 0;text-align:left}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;display:none;max-width:90%;font-size:14px;text-align:center}
@media(prefers-color-scheme:dark){:root[data-bg="gray"]:not([data-theme="light"]){--bg:#121212;--card:#1f1f22;--ln:#2a2a2d}}
:root[data-theme="dark"][data-bg="gray"]{--bg:#121212;--card:#1f1f22;--ln:#2a2a2d}
.pri,.chips .on{color:var(--acx,#000)}
.card,.tile,#mini{border-radius:var(--r,14px)}
.cv,#art{border-radius:var(--cr,10px)}.sc.rd .cv{border-radius:50%}.tile .cv{border-radius:0}
.vl{display:flex;align-items:center;gap:8px;margin:6px 0}.vl input{flex:1;accent-color:#fff}
.srow{display:flex;justify-content:space-between;margin:10px 0 2px}
.sw{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--ln)}
h1{font-size:34px;font-weight:800;letter-spacing:-.9px;margin:4px 0 14px}
h3{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:26px 0 10px}
.chips button{padding:7px 15px;font-size:14px;font-weight:500}
.card{background:var(--card);border-radius:var(--r,18px);padding:16px;margin:12px 0}
.card>b:first-child{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);font-weight:600;margin-bottom:6px}
.row{position:relative;padding:8px 0}
.row::after{content:"";position:absolute;left:64px;right:0;bottom:0;height:.5px;background:var(--ln)}
.card .row::after{left:0}.card .row:last-child::after{display:none}
.row .cv{width:52px;height:52px}
.row.lk{cursor:pointer;padding:12px 0}.chev{color:var(--mu);font-size:22px;line-height:1}
.fr input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.sc{width:160px}.sc .cv{width:160px;height:160px;border-radius:var(--cr,10px);box-shadow:0 8px 22px #0003}
.shelf.lg .sc{width:210px}.shelf.lg .sc .cv{width:210px;height:210px}
.shelf{gap:16px;margin:0 -16px;padding:0 16px 8px}
.tile{height:64px;border-radius:14px;font-weight:600}.tile .cv{width:64px;height:64px}
.ib{color:var(--mu)}.ib.on-h{color:var(--ac)}
.ib svg{width:26px;height:26px;display:block}.big{display:flex;align-items:center;justify-content:center}.big svg{width:30px;height:30px}
#mini{height:64px;border-radius:16px;box-shadow:0 8px 28px #0003;border:.5px solid var(--ln)}
#mini .cv{width:46px;height:46px}#mini .t{font-weight:600}#mini .ib{color:var(--tx)}#mini .ib.on-h{color:var(--ac)}
#nav{border-top:.5px solid var(--ln)}
#nav button{color:var(--mu);font-size:10px;font-weight:500}#nav .on{color:var(--ac)}
.segc{display:flex;background:rgba(120,120,128,.2);border-radius:10px;padding:2px;margin:6px 0}
.segc button{flex:1;background:none;border-radius:8px;padding:7px 4px;font-size:13px}
.segc .on{background:var(--bg);box-shadow:0 1px 4px #0003;font-weight:600}
.tgl{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;padding:0;flex:none}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0004;transition:left .2s}
.tgl.on{background:var(--ac)}.tgl.on::after{left:22px}
.hero2{text-align:center;margin:6px 0 16px}
.hero2 .cv{width:230px;height:230px;margin:0 auto 16px;font-size:72px;box-shadow:0 20px 44px #0005}
.hero2 h1{font-size:24px;margin:0 0 2px}
.pbtns{display:flex;gap:10px;margin-bottom:10px}.pbtns button{flex:1;color:var(--ac);font-weight:600;border-radius:12px;padding:13px;font-size:16px}
.bk{background:none;color:var(--ac);padding:4px 0;font-size:17px}
.sheet>div{border-radius:22px 22px 0 0}
.sheet button{background:var(--card);border-radius:13px;text-align:center;padding:14px;font-size:16px;margin:6px 0}
.sheet .pri{background:var(--ac);color:var(--acx,#fff)}
#toast{background:rgba(44,44,46,.92);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#art{transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 60px #000a}
.ex button{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
input[type=text]{border-radius:12px;background:rgba(120,120,128,.16)}
.row{content-visibility:auto;contain-intrinsic-size:auto 68px}
:root[data-lite="1"] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;transition:none!important}
:root[data-lite="1"] #nav{background:var(--bg)!important}:root[data-lite="1"] #mini{background:var(--card)!important}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;overflow:hidden;transition:opacity .5s ease,transform .5s ease}
#splash::before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 42%,transparent),transparent 65%);animation:sbglow 2.4s ease-out both}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sb-logo{position:relative;width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 70%,#fff),var(--ac));display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 20px 60px color-mix(in srgb,var(--ac) 50%,transparent);animation:sbpop .7s cubic-bezier(.2,1.4,.4,1) both}
.sb-logo i{width:8px;border-radius:4px;background:#fff;height:4px;animation:sbrise .7s cubic-bezier(.2,1.6,.4,1) both,sbeq .9s ease-in-out infinite}
.sb-logo i:nth-child(1){--h:24px;animation-delay:.2s,1.1s}.sb-logo i:nth-child(2){--h:42px;animation-delay:.3s,1.25s}.sb-logo i:nth-child(3){--h:58px;animation-delay:.4s,1.4s}.sb-logo i:nth-child(4){--h:36px;animation-delay:.5s,1.15s}.sb-logo i:nth-child(5){--h:20px;animation-delay:.6s,1.3s}
.sb-px{position:absolute;inset:0;pointer-events:none}
.sb-px b{position:absolute;left:var(--x);top:var(--y);width:6px;height:6px;border-radius:1px;background:var(--ac);opacity:0;animation:sbpx 1.7s ease-out both}
.sb-word{margin-top:28px;font-size:40px;font-weight:800;letter-spacing:-1.2px;display:flex}
.sb-word span{display:inline-block;animation:sbl .55s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(.75s + var(--i) * .055s)}
.sb-word .b{color:var(--ac)}
.sb-hi{margin-top:6px;color:#ffffffb3;font-size:16px;letter-spacing:.3px;animation:sbup .6s 1.5s both}
@keyframes sbpop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sbrise{from{height:4px}to{height:var(--h)}}
@keyframes sbeq{0%,100%{height:var(--h)}50%{height:calc(var(--h) * .45)}}
@keyframes sbl{from{opacity:0;transform:translateY(24px) scale(.7)}to{opacity:1;transform:none}}
@keyframes sbup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sbpx{0%{opacity:0;transform:translateY(24px)}25%{opacity:1}100%{opacity:0;transform:translateY(-90px) rotate(100deg)}}
@keyframes sbglow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

<script>
var lib=[],lists=[],likes={},recents=[],tab="home",chip="Todo",q="",open=null,queue=[],qi=-1,playing=false,shuf=false,rep=false,speed=1,sleepM=0,sleepH=null,cvOn=true,drag=false,tsel=null,Ls=[],bass=0,hist=[];
var $=function(i){return document.getElementById(i)},au=$("au"),AN=!!window.Android;
function ld(){try{var d=JSON.parse(localStorage.getItem("tb4")||"null");if(d){lists=d.lists||[];likes=d.likes||{};recents=d.recents||[];plays=d.plays||{}}}catch(e){}}
function sv(){try{localStorage.setItem("tb4",JSON.stringify({lists:lists,likes:likes,recents:recents,plays:plays}))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function norm(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function hue(s){var h=0;s=s||"?";for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function bg(s){var h=hue(s);return"linear-gradient(135deg,hsl("+h+",62%,50%),hsl("+(h+40)+",60%,30%))"}
function fmt(s){s=Math.round(s||0);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3500)}
function mk(o){o.title=o.title||"Sin título";o.artist=o.artist&&o.artist!="<unknown>"?o.artist:"Artista desconocido";o.album=o.album&&o.album!="<unknown>"?o.album:"Álbum desconocido";o.nt=norm(o.title);o.na=norm(o.artist);o.k=o.nt+"|"+o.na;o.genre=(o.genre&&o.genre!="<unknown>")?o.genre:"";o.added=+o.added||0;o.art=o.mid?"https://tb.local/c/"+o.mid:"";return o}
function libSig(a){var h=0;a.forEach(function(t){var x=(t.mid||"")+t.k;for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0});return a.length+":"+h}
function setLib(a){var seen={},n=a.filter(function(t){if(seen[t.k])return false;return seen[t.k]=1}).sort(function(x,y){return x.title.localeCompare(y.title)});if(lib.length&&libSig(n)==libSig(lib))return false;lib=n;render();return true}
function saveLib(){try{localStorage.setItem("tb4lib",JSON.stringify(lib.filter(function(t){return t.mid}).map(function(t){return[t.mid,t.title,t.artist,t.album,t.dur,t.added,t.genre]})))}catch(e){}}
function loadLib(){try{return(JSON.parse(localStorage.getItem("tb4lib")||"[]")).map(function(a){return mk({mid:a[0],title:a[1],artist:a[2],album:a[3],dur:a[4],added:a[5],genre:a[6],src:"https://tb.local/a/"+a[0]})})}catch(e){return[]}}
function find(t,a){var nt=norm(t),na=norm(a||"");return lib.filter(function(x){return x.nt==nt&&(!na||x.na.indexOf(na)>-1||na.indexOf(x.na)>-1)})[0]||lib.filter(function(x){return x.nt==nt})[0]||null}

/* Scan the device (Android MediaStore) or pick audio files (browser) */
window.scanNative=function(quiet){if(!AN)return;try{var a=JSON.parse(Android.scan());
  if(!a.length&&lib.length){if(!quiet)toast("No se pudo leer el dispositivo. Mostrando tu última biblioteca; revisa el permiso de audio");return}
  var ch=setLib(a.map(function(o){o.src="https://tb.local/a/"+o.mid;return mk(o)}));if(ch)saveLib();
  if(!quiet)toast(lib.length+" canciones en tu biblioteca");else if(ch)toast("Biblioteca actualizada: "+nc(lib.length))}catch(e){if(!quiet)toast("No se pudo escanear. Revisa el permiso de audio")}};
function addFiles(fs){var a=lib.slice();fs.forEach(function(f){if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name))return;var n=f.name.replace(/\.[^.]+$/,""),p=n.split(" - ");a.push(mk({title:p.length>1?p.slice(1).join(" - "):n,artist:p.length>1?p[0]:"",album:"",added:Math.round((f.lastModified||0)/1000),src:URL.createObjectURL(f)}))});setLib(a);toast("Biblioteca: "+nc(lib.length))}

/* CSV + JSON import: builds playlists and matches rows against the scanned library */
function parseCSV(t){var rows=[],r=[],f="",q=false,i,c;t=t.replace(/^\uFEFF/,"");
  for(i=0;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","||c==";"){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
function fromCSV(t){var rows=parseCSV(t);if(rows.length<2)return[];var h=rows[0].map(function(x){return x.trim().toLowerCase()});
  function col(n){for(var i=0;i<h.length;i++)if(n.indexOf(h[i])>-1)return i;return -1}
  var ct=col(["title","titulo","título","name","nombre","track","song","cancion","canción"]),ca=col(["artist","artista","artists"]),cl=col(["playlist","lista"]),cb=col(["album","álbum"]);if(ct<0)return[];
  return rows.slice(1).map(function(r){return{t:(r[ct]||"").trim(),a:ca>-1?(r[ca]||"").trim():"",b:cb>-1?(r[cb]||"").trim():"",l:cl>-1?(r[cl]||"").trim():""}}).filter(function(x){return x.t})}
function fromJSON(t,fn){var j=JSON.parse(t),out=[];
  function tr(a,l){(a||[]).forEach(function(x){if(typeof x=="string")out.push({t:x,a:"",l:l});else{var o=x.track||x;out.push({t:o.title||o.name||o.titulo||"",a:o.artist||o.artista||(o.artists&&o.artists[0]&&(o.artists[0].name||o.artists[0]))||"",l:l})}})}
  if(Array.isArray(j))tr(j,"");else if(j.playlists)j.playlists.forEach(function(p){tr(p.tracks||p.items||p.songs,p.name||p.title||fn)});else tr(j.tracks||j.items||j.songs,j.name||j.title||"");return out.filter(function(x){return x.t})}
function importMeta(name,rows){if(!rows.length){toast("No encontré canciones en ese archivo");return}
  var base=name.replace(/\.[^.]+$/,""),g={},hit=0;rows.forEach(function(r){var l=r.l||base;(g[l]=g[l]||[]).push({t:r.t,a:r.a});if(find(r.t,r.a))hit++});
  Object.keys(g).forEach(function(l){var p=lists.filter(function(x){return x.name==l})[0];if(!p){p={name:l,items:[]};lists.push(p)}g[l].forEach(function(i){if(!p.items.some(function(z){return norm(z.t)==norm(i.t)}))p.items.push(i)})});
  sv();render();toast(Object.keys(g).length+" playlist(s). "+hit+" de "+rows.length+" canciones encontradas en tu biblioteca")}
document.addEventListener("change",function(e){var i=e.target;if(!i||i.type!="file"||!i.files||!i.files.length)return;var fs=[].slice.call(i.files),k=i.dataset.k;i.value="";
  if(k=="audio")return addFiles(fs);if(k=="lyrics")return addLyrics(fs);if(k=="lyr1"){fs[0].text().then(function(tx){var t=queue[qi];if(t){LY[t.k]=tx;delete LP[t.k];saveLY();lyBuild();closeSheet()}});return}
  var f=fs[0],r=new FileReader();r.onerror=function(){toast("No se pudo leer el archivo")};
  r.onload=function(){var t=r.result;try{var js=/\.json$/i.test(f.name)||/^\s*[\[{]/.test(t);importMeta(f.name,js?fromJSON(t,f.name.replace(/\.[^.]+$/,"")):fromCSV(t))}catch(x){toast("El archivo no tiene un formato válido")}};r.readAsText(f)});

/* Views */
function cover(s,c,t){return '<div class="cv" style="background:'+bg(s)+'">'+esc((s[0]||"?").toUpperCase())+(c||"")+(t&&t.art?'<img loading="lazy" decoding="async" src="'+t.art+'" data-k="'+esc(t.k)+'" onerror="artErr(this)">':'')+'</div>'}
function lst(a){Ls.push(a);return Ls.length-1}
function row(t,l,i){var cur=queue[qi]&&queue[qi].k==t.k,lk=likes[t.k];return '<div class="row'+(cur?' cur':'')+'" data-rk="'+esc(t.k)+'">'+cover(t.album,"",t)+'<div class="m" data-p="'+l+'_'+i+'"><div class="t">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+(t.dur?" · "+fmt(t.dur):"")+'</div></div><button class="ib'+(lk?' on-h':'')+'" data-like="'+t.k+'">'+likeIco(lk)+'</button><button class="ib" data-more="'+t.k+'">'+ICO.more+'</button></div>'}
var CH=60;
function list(a){var l=lst(a);if(!a.length)return '<div class="empty">Nada por aquí todavía.</div>';return a.slice(0,CH).map(function(t,i){return row(t,l,i)}).join("")+(a.length>CH?'<div class="mr" data-l="'+l+'" data-n="'+CH+'"></div>':'')}
var IO=window.IntersectionObserver?new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target,l=+el.dataset.l,n=+el.dataset.n,a=Ls[l];if(!a)return;IO.unobserve(el);var h="";for(var i=n;i<Math.min(a.length,n+CH);i++)h+=row(a[i],l,i);el.insertAdjacentHTML("beforebegin",h);if(n+CH>=a.length)el.remove();else{el.dataset.n=n+CH;IO.observe(el)}})},{rootMargin:"900px"}):null;
function obs(){if(IO)document.querySelectorAll(".mr").forEach(function(e){IO.observe(e)})}
function shelf(a,cls){var l=lst(a);return '<div class="shelf">'+a.map(function(t,i){return '<div class="sc '+(cls||"")+'" data-p="'+l+'_'+i+'">'+cover(t.album,"",t)+'<div class="t" style="margin-top:6px;font-weight:600">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+'</div></div>'}).join("")+'</div>'}
function uniq(f){var m={};lib.forEach(function(t){var k=f=="genre"?gen(t):t[f];(m[k]=m[k]||[]).push(t)});return m}
function plTracks(p){return p.items.map(function(i){return find(i.t,i.a)}).filter(Boolean)}
function colOf(o){if(o.t=="mix"){var mx=MIXES[+o.k]||{n:"Mix",s:"",tr:[]};return{n:mx.n,s:"Hecho para ti",tr:mx.tr}}if(o.t=="album")return{n:o.k,s:"Álbum",tr:srt(lib.filter(function(x){return x.album==o.k}))};if(o.t=="genre")return{n:o.k,s:"Género",tr:srt(lib.filter(function(x){return gen(x)==o.k}))};if(o.t=="artist")return{n:o.k,s:"Artista",tr:srt(lib.filter(function(x){return x.artist==o.k}))};
  if(o.t=="fav")return{n:"Canciones que te gustan",s:"Playlist",tr:srt(lib.filter(function(x){return likes[x.k]}))};var p=lists[o.k];return{n:p.name,s:"Playlist · "+p.items.length+" elementos",tr:plTracks(p)}}
function greet(){var h=new Date().getHours();return h<12?"Buenos días":h<20?"Buenas tardes":"Buenas noches"}
function rowL(t,a){return '<div class="row lk" '+a+'><div class="m"><div class="t">'+t+'</div></div><span class="chev">›</span></div>'}
function rowF(t,a){return '<div class="row lk fr"><div class="m"><div class="t">'+t+'</div></div><span class="chev">›</span><input type="file" '+a+'></div>'}
function importCard(){return '<div class="card"><b>Biblioteca y datos</b>'+(AN?rowL("Escanear dispositivo",'data-scan="1"'):rowF("Elegir archivos de audio",'accept="audio/*" multiple data-k="audio"'))+rowF("Importar playlists (CSV o JSON)",'data-k="meta"')+rowF("Importar letras (.lrc o .txt)",'multiple data-k="lyrics"')+rowL("Identificar carátulas y géneros",'data-ident="1"')+'<div class="a" style="margin-top:8px">CSV: <code>title, artist, playlist</code>. JSON: lista de canciones o <code>{"playlists":[…]}</code>. Se enlazan con tu música por título y artista.</div></div>'}
function emptyHome(){return '<div class="card" style="text-align:center;padding:34px 18px"><div style="font-size:46px">♪</div><div class="t" style="font-size:20px;font-weight:700;margin:6px 0">Tu música aparecerá aquí</div><div class="a" style="margin-bottom:16px">'+(AN?'Escanea los audios de tu teléfono.':'Elige los archivos de audio de tu dispositivo.')+'</div>'+(AN?'<button class="pri" data-scan="1">Escanear dispositivo</button>':'<span class="fb"><button class="pri">Elegir audios</button><input type="file" accept="audio/*" multiple data-k="audio"></span>')+'</div>'}
function render(){Ls=[];CTX=open?(open.t=="fav"?"Canciones que te gustan":open.t=="list"?(lists[open.k]||{}).name:open.k):tab=="search"?"Búsqueda":tab=="lib"?"Tu biblioteca":chip=="Todo"?"Inicio":chip;var h="",a;
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t==tab)});
  if(open){var c=colOf(open),l=lst(c.tr);h='<button class="bk" data-back="1">‹ Volver</button><div class="hero2">'+cover(c.n,"",c.tr[0])+'<h1>'+esc(c.n)+'</h1><div class="a">'+c.s+' · '+c.tr.length+' canciones</div></div><div class="pbtns"><button data-pl="'+l+'">▶ Reproducir</button><button data-pl="'+l+'s">⇄ Aleatorio</button></div>'+(open.t=="artist"?'<div class="pbtns">'+folBtn(FOL.a[open.k],'data-fola="'+esc(open.k)+'"')+'</div>':'')+(open.t!="list"?seg("sort",[["az","A–Z"],["added","Recién añadidas"]]):'')+(open.t=="list"?'<div class="pbtns"><button data-pren="'+open.k+'">Renombrar</button><button data-pdel="'+open.k+'">Eliminar</button></div>':'')+list(c.tr)}
  else if(tab=="set"){h=settingsView()}else if(tab=="podcast"){h=podView()}else if(tab=="search"){h=searchView()}
