<!DOCTYPE html>

<style>
:root{--bg:#fff;--card:#f2f2f7;--tx:#111;--mu:#6e6e78;--ac:#1ed760;--ln:#e3e3e8;--nav:56px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989f;--ln:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989f;--ln:#2c2c2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0} body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
#main{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--nav) + 110px)} h1{font-size:30px;letter-spacing:-.5px;margin:6px 0 12px}h3{margin:22px 0 8px;font-size:19px} button{font:inherit;color:inherit;background:var(--card);border:0;border-radius:999px;padding:9px 16px;cursor:pointer} .pri{background:var(--ac);color:#000;font-weight:600} .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.chips button{flex:none}.chips .on{background:var(--ac);color:#000;font-weight:600} input[type=text]{width:100%;background:var(--card);color:var(--tx);border:0;border-radius:12px;padding:12px 14px;font:inherit;margin:6px 0} .fb{position:relative;display:inline-block;overflow:hidden;border-radius:999px;vertical-align:middle} .fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer} .fb.blk{display:block;margin:6px 0}.fb.blk button{width:100%;text-align:left} .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .tile{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;height:56px;padding-right:8px} .tile .cv{border-radius:0;width:56px;height:56px}.tile b{font-size:14px;line-height:1.2} .shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px} .sc{flex:none;width:140px;cursor:pointer}.sc .cv{width:140px;height:140px;border-radius:10px;font-size:42px}.sc.rd .cv{border-radius:50%}.sc.rd{text-align:center} .row{display:flex;align-items:center;gap:12px;padding:7px 0}.row.cur .t{color:var(--ac)} .cv{position:relative;overflow:hidden;width:48px;height:48px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}.cv img,#art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .m{flex:1;min-width:0;cursor:pointer}.t,.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a{color:var(--mu);font-size:13px} .ib{background:none;padding:6px 10px;font-size:20px}.on-h{color:var(--ac)} .empty{color:var(--mu);text-align:center;padding:26px 8px}.card{background:var(--card);border-radius:16px;padding:14px;margin:8px 0} .hero{display:flex;gap:14px;align-items:flex-end;margin:10px 0 14px}.hero .cv{width:120px;height:120px;border-radius:12px;font-size:40px} code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:12px} #nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:color-mix(in srgb,var(--bg) 90%,transparent);border-top:1px solid var(--ln)} #nav button{flex:1;background:none;border-radius:0;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}#nav button b{font-size:21px;font-weight:700} #mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 8px);height:60px;border-radius:14px;background:color-mix(in srgb,var(--card) 88%,transparent);box-shadow:0 10px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:15} #mini .cv{width:44px;height:44px;border-radius:6px}#mini .pl{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:#8884}#mini .pl i{display:block;height:100%;background:var(--tx);width:0} #np{position:fixed;inset:0;z-index:20;display:none;color:#fff;--tx:#fff;--mu:#ffffffb3;--card:#ffffff26;background:#121212;overflow:hidden} #np.show{display:block}#cvs{position:absolute;inset:0;width:100%;height:100%} #npc{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;max-width:720px;margin:0 auto} #np .hd{display:flex;align-items:center;justify-content:space-between;height:44px}#np .hd small{color:var(--mu);font-size:12px;text-align:center} #art{position:relative;overflow:hidden;width:min(78%,300px);aspect-ratio:1;margin:auto;border-radius:16px;display:grid;place-items:center;font-size:72px;font-weight:700;box-shadow:0 20px 50px rgba(0,0,0,.35)} #nt{font-size:22px;font-weight:700}#sc{width:100%;accent-color:#fff;margin:12px 0 0}.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:12px} .ctl{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.ctl .ib{font-size:24px;color:#fff}.big{width:66px;height:66px;border-radius:50%;background:#fff;color:#000;font-size:26px;font-weight:700;display:grid;place-items:center} .sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:40}.sheet.show{display:flex}.sheet>div{background:var(--bg);color:var(--tx);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto} .sheet button{width:100%;margin:4px 0;text-align:left} #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:50;display:none} 
</style>

<body>
<div id="splash"><div class="sb-px"></div><div class="sb-logo"><i></i><i></i><i></i><i></i><i></i></div><div class="sb-word" id="sbw"></div><div class="sb-hi">Bienvenido</div></div>
<div id="main"></div>
<div id="mini"><div class="cv" id="mcv"></div><div class="m" id="mtx"><div class="t" id="mt"></div><div class="a" id="ma"></div></div><button class="ib" id="mdv"></button><button class="ib" id="mp"></button></div>
<div id="np"><canvas id="cvs"></canvas><div id="npc"><div class="npt"><div class="hd"><button class="ib" id="npx" style="color:#fff">⌄</button><small>REPRODUCIENDO DESDE<br><b style="color:#fff" id="nal"></b></small><button class="ib" id="nmo" style="color:#fff">☰</button></div><div id="art"></div><div style="display:flex;align-items:center;gap:8px"><div class="m" style="cursor:default"><div id="nt" class="t"></div><div class="a" id="na"></div></div><button class="ib" id="nh" style="font-size:22px">♥</button></div><input type="range" id="sc" min="0" max="1000" value="0"><div class="tm"><span id="tc">0:00</span><span id="td">0:00</span></div><div class="ctl"><button class="ib" id="ns">⇄</button><button class="ib" id="npv">⏮</button><button class="big" id="np2">▶</button><button class="ib" id="nx">⏭</button><button class="ib" id="nr">↻</button></div><div class="vl"><span>🔈</span><input type="range" id="vol" min="0" max="100" value="70"><span>🔊</span></div><div class="npb"><div class="card" id="lyc"><div class="lych"><b>Letra</b><span class="a">Mostrar más ›</span></div><div class="lyp" id="lyp"></div></div><div class="card" id="abt"></div><div class="card" id="nxq"></div></div></div></div></div>
<div class="sheet" id="sheet"><div id="sb"></div></div><div id="toast"></div><audio id="au" crossorigin="anonymous"></audio><nav id="nav"></nav>
<script>
var lib=[],lists=[],likes={},recents=[],tab="home",chip="Todo",q="",open=null,queue=[],qi=-1,playing=false,shuf=false,rep=false,speed=1,sleepM=0,sleepH=null,cvOn=true,drag=false,tsel=null,Ls=[],plays={},podcastResults=[],podcastFeedState=null;
var $=function(i){return document.getElementById(i)},au=$("au"),AN=!!window.Android;
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML.replace(/\"/g,"&quot;").replace(/'/g,"&#39;");}
function norm(s){return(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function hue(s){var h=0;s=s||"?";for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function bg(s){var h=hue(s);return"linear-gradient(135deg,hsl("+h+",62%,50%),hsl("+(h+40)+",60%,30%))"}
function fmt(s){s=Math.round(s||0);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3500)}
function mk(o){o.title=o.title||"Sin título";o.artist=o.artist&&o.artist!="<unknown>"?o.artist:"Artista desconocido";o.album=o.album&&o.album!="<unknown>"?o.album:"Álbum desconocido";o.nt=norm(o.title);o.na=norm(o.artist||"");o.k=o.k||String(Math.random()).slice(2);o.art=o.art||"";return o}
function setLib(a){var seen={},n=a.filter(function(t){if(seen[t.k])return false;return seen[t.k]=1}).sort(function(x,y){return x.title.localeCompare(y.title)});lib=n;saveLib();render();}
function saveLib(){try{localStorage.setItem("tb4lib",JSON.stringify(lib.map(function(t){return[t.k,t.title,t.artist,t.album,t.dur,t.added,t.genre,t.art,t.src]})))}catch(e){}} 
function loadLib(){try{return(JSON.parse(localStorage.getItem("tb4lib")||"[]")).map(function(a){return mk({k:a[0],title:a[1],artist:a[2],album:a[3],dur:a[4],added:a[5],genre:a[6],art:a[7],src:a[8]})})}catch(e){return[]}} 
function setCI(){var t=queue[qi];if(!t)return;$("art").style.background=bg(t.album||t.title||"P");$("art").innerHTML=t.art?('<img src="'+t.art+'">'):esc((t.title||"P")[0]||"?").toUpperCase();}
function render(){var h='';if(tab=="search"){h='<div class="th"><h1>Buscar</h1></div><input type="text" id="q" placeholder="¿Qué quieres escuchar?" value="'+esc(q)+'"><div id="res"></div>'+podcastHtml();}else if(tab=="home"){h='<div class="card"><b>Inicio</b><div class="a">Tu biblioteca y tus podcasts.</div></div>';}else if(tab=="lib"){h='<div class="card"><b>Biblioteca</b>'+(lib.length?lib.slice(0,10).map(function(t){return '<div class="row" data-p="0_'+lib.indexOf(t)+'"><div class="cv" style="background:'+bg(t.album)+'">'+esc((t.title||"?")[0].toUpperCase())+'</div><div class="m"><div class="t">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+'</div></div></div>'}).join(""):'<div class="empty">Nada por aquí todavía.</div>')+'</div>';}$("main").innerHTML=h;}
function searchPodcasts(term){term=(term||"").trim();if(!term){podcastResults=[];return}fetch("https://tb.local/ps?q="+encodeURIComponent(term),{headers:{Accept:"application/json"}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){podcastResults=((d&&d.results)||[]).map(function(p){return{title:(p.collectionName||p.trackName||"Podcast").trim()||"Podcast",art:p.artworkUrl600||p.artworkUrl100||"",feed:p.feedUrl||"",genre:p.primaryGenreName||"",desc:p.artistName||""}}).filter(function(p){return p.title&&p.feed});if(tab=="search")render();}).catch(function(){podcastResults=[];if(tab=="search")render();});}
function podcastHtml(){if(tab!=="search"||!q||!q.trim()||!podcastResults.length)return"";return '<h3>Podcasts</h3><div class="card">'+podcastResults.slice(0,6).map(function(p,i){return '<div class="row lk" data-podcast="'+i+'"><div class="cv" style="'+(p.art?'background-image:url('+p.art+');background-size:cover;background-position:center;':'background:'+bg(p.title||'P')+';')+'">'+(p.art?'':'P')+'</div><div class="m"><div class="t">'+esc(p.title)+'</div><div class="a">'+esc(p.genre||'Podcast')+'</div></div><span class="chev">›</span></div>';}).join("")+'</div>'}
function openPodcastResult(index){var p=podcastResults[index];if(!p||!p.feed)return;fetch("https://tb.local/pod?u="+encodeURIComponent(p.feed),{headers:{Accept:"application/json"}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){var eps=(d&&d.eps)||[];$("sb").innerHTML='<b>'+esc(p.title)+'</b>'+(p.genre?'<div class="a" style="margin:4px 0 10px">'+esc(p.genre)+'</div>':'')+(eps.length?eps.slice(0,12).map(function(ep,i){return '<button data-podcast-episode="'+i+'"><b>'+esc(ep.t||'Episodio')+'</b><div class="a">'+esc(ep.d?fmt(ep.d):'Podcast')+'</div></button>'}).join(""):'<div class="a">Sin episodios disponibles.</div>');$("sheet").classList.add("show");podcastFeedState={podcast:p,eps:eps};}).catch(function(){$("sb").innerHTML='<b>'+esc(p.title)+'</b><div class="a" style="margin:8px 0">No se pudo cargar este podcast.</div>';$("sheet").classList.add("show");});}
function playPodcastEpisode(index){if(!podcastFeedState||!podcastFeedState.eps||!podcastFeedState.eps[index])return;var ep=podcastFeedState.eps[index];if(!ep.u)return;var entry={k:"podcast-"+(ep.u||Math.random()),title:(ep.t||"Episodio").trim()||"Episodio",artist:podcastFeedState.podcast.title||"Podcast",album:"Podcast",art:podcastFeedState.podcast.art||"",src:ep.u,dur:ep.d||0,genre:"Podcast"};queue=[entry];qi=0;queueCtx="Podcast";closeSheet();load();}
function closeSheet(){ $("sheet").classList.remove("show"); }
function load(){var t=queue[qi];if(!t)return;au.src=t.src;au.playbackRate=speed;au.play().catch(function(){toast("No se pudo reproducir este archivo")});ui();}
function toggle(){if(!queue[qi]){return}au.paused?au.play():au.pause()} 
function ui(){var t=queue[qi];if(!t){$("mini").style.display="none";return}$("mini").style.display="flex";$("mt").textContent=t.title;$("ma").textContent=t.artist;$("nt").textContent=t.title;$("na").textContent=t.artist;$("nal").textContent=queueCtx||t.album;$("mcv").style.background=bg(t.album||t.title||"P");$("mcv").innerHTML=t.art?'<img src="'+t.art+'">':esc((t.title||"?")[0].toUpperCase());$("art").style.background=bg(t.album||t.title||"P");$("art").innerHTML=t.art?'<img src="'+t.art+'">':esc((t.title||"?")[0].toUpperCase());}
function res(){if(!q)return"";return '<div class="card"><b>Resultados</b>'+lib.filter(function(x){return x.title.toLowerCase().indexOf(q.toLowerCase())>-1||x.artist.toLowerCase().indexOf(q.toLowerCase())>-1}).slice(0,6).map(function(x){return '<div class="row"><div class="cv" style="background:'+bg(x.album)+'">'+esc((x.title||"?")[0].toUpperCase())+'</div><div class="m"><div class="t">'+esc(x.title)+'</div><div class="a">'+esc(x.artist)+'</div></div></div>';}).join("")+'</div>'}
var NI={home:'<path class="f" d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',lib:'<path d="M5 4v16M10 4v16"/>'};
function buildNav(){var nav=[['home','Inicio'],['search','Buscar'],['lib','Biblioteca']];$("nav").innerHTML=nav.map(function(x){return '<button data-t="'+x[0]+'">'+(x[0]==='home'?NI.home:x[0]==='search'?NI.search:NI.lib)+'<span>'+x[1]+'</span></button>'}).join("");$("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.t;render();scrollTo(0,0)};}
$("main").oninput=function(e){var i=e.target;if(i.id=="q"){q=i.value;searchPodcasts(q);$("res").innerHTML=res();render();return;}};
$("main").onclick=function(e){var t=e.target,g;if(g=t.closest("[data-podcast]")){openPodcastResult(+g.dataset.podcast);return;} if(g=t.closest("[data-p]")){var p=g.dataset.p.split("_");if(lib[+p[1]]){queue=[lib[+p[1]]];qi=0;queueCtx="Biblioteca";load();return;}} if(g=t.closest("[data-t]")){tab=g.dataset.t;render();return;}};
$("sb").onclick=function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.podcastEpisode!==undefined){playPodcastEpisode(+b.dataset.podcastEpisode);return;} };
$("mp").onclick=toggle;$("np2").onclick=toggle;document.addEventListener("click",function(e){var g=e.target.closest("[data-podcast]");if(g){openPodcastResult(+g.dataset.podcast)}},true);
;(function(){var w=$("sbw");w.innerHTML="SoundBits".split("").map(function(c,i){return '<span style="--i:'+i+'">'+c+'</span>'}).join(""); setTimeout(function(){var sp=document.getElementById("splash");sp.classList.add("out");setTimeout(function(){sp.remove()},520)},2700); lib=loadLib(); buildNav(); render(); if(AN)try{S.vol=Android.getVol();$("vol").value=S.vol}catch(e){} })();
</script>
