  }else if(tab=="pod"){h=podView()}else if(tab=="set"){h=settingsView()}else if(tab=="search"){h='<h1>Buscar</h1><input type="text" id="q" placeholder="Canciones, artistas o álbumes" value="'+esc(q)+'"><div id="streambox"></div>';}else if(tab=="lib"){h=libView()}else{h='';if(!lib.length)h+=emptyHome();else if(chip=="Todo"){h+=netHome();h+=renderLocalHome();}else{var t=chip=="Artistas"?"artist":chip=="Géneros"?"genre":"album",m=uniq(t);h+=seg("sort",[["az","A–Z"],["added","Recién añadidas"]])+ks(m).map(function(k){return '<div class="row"><div class="m"><div class="t">'+esc(k)+'</div></div><button class="ib" data-open="'+t+'_'+esc(k)+'">›</button></div>'}).join("")}}
  $("main").innerHTML=h;
  obs();
  if(tab=="search"&&!open)onlineSearch();
}

// Inicialización de la interfaz: el HTML anterior definía render(), pero nunca
// construía la navegación ni dibujaba la primera pantalla.
(function bootTuneBox(){
  var nav=$("nav");
  if(nav && !nav.children.length){
    var items=[["home","Inicio"],["search","Buscar"],["lib","Biblioteca"],["pod","Podcasts"],["set","Ajustes"]];
    nav.innerHTML=items.map(function(it){return '<button type="button" data-t="'+it[0]+'">'+(typeof svt==='function'&&typeof NI==='object'?svt(NI[it[0]]):'<b>♪</b>')+'<span>'+it[1]+'</span></button>';}).join('');
  }
  if(nav) nav.addEventListener('click',function(e){var b=e.target.closest('button[data-t]');if(!b)return;tab=b.dataset.t;open=null;render();});
  try{if(typeof ld==='function')ld();}catch(e){}
  try{if(typeof render==='function')render();}catch(e){var m=$("main");if(m)m.innerHTML='<div class="card"><b>No se pudo iniciar TuneBox</b><p>La interfaz encontró un error al iniciar. Reinicia la aplicación.</p></div>'; }
  if(AN && typeof window.scanNative==='function'){try{window.scanNative();}catch(e){}}
})();

</script>
